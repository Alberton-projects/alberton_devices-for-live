name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm test
      - run: python3 tools/check_embedded.py
      - run: python3 tools/sync_shared.py --check
      - run: python3 tools/check_rules.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
